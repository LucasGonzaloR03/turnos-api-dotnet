name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependencias
        run: dotnet restore Turnos.sln

      - name: Compilar
        run: dotnet build Turnos.sln --no-restore --configuration Release

      - name: Tests unitarios
        run: dotnet test Turnos.sln --no-build --configuration Release --verbosity normal

  docker:
    name: Validar Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -t turnos-api:ci .
